name: V11 WebKit mobile full profile

on:
  pull_request:
    paths:
      - .github/workflows/webkit-mobile-v11-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ATTEMPT_DIR: build/qa/webkit-mobile-v11-${{ github.run_id }}-${{ github.run_attempt }}
      FACILITY_ASSET_RELEASE: facility-v11
      FACILITY_3D_MODE: auto-adaptive
      FACILITY_REQUIRE_SERVICE_DETAIL: "1"
      FACILITY_REQUIRE_ACTIVE_READING_PATH: "1"
      GRIDNINJA_CSP_MODE: enforce
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Record environment and install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$ATTEMPT_DIR"
          npm install --global npm@10.9.8 > "$ATTEMPT_DIR/npm-toolchain.log" 2>&1
          {
            git rev-parse HEAD
            node --version
            npm --version
            uname -a
            sha256sum package-lock.json
          } > "$ATTEMPT_DIR/environment.txt"
          npm ci > "$ATTEMPT_DIR/npm-ci.log" 2>&1
          npx playwright install --with-deps webkit > "$ATTEMPT_DIR/browser-install.log" 2>&1
      - name: Build and bind a new V11 candidate
        run: |
          set -euo pipefail
          npm run build > "$ATTEMPT_DIR/build.log" 2>&1
          node scripts/qa/candidate.mjs init --ledger "$ATTEMPT_DIR/candidate.json" > "$ATTEMPT_DIR/candidate-init.log" 2>&1
          npx playwright test --list --project=webkit-mobile --reporter=json > "$ATTEMPT_DIR/inventory.json" 2> "$ATTEMPT_DIR/inventory.log"
          node scripts/qa/webkit-mobile-v11-profile.mjs prepare "$ATTEMPT_DIR" > "$ATTEMPT_DIR/policy-preparation.log" 2>&1
      - name: Run every WebKit mobile case without retries
        env:
          CI: "1"
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$ATTEMPT_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          build_id=$(cat .next/BUILD_ID)
          test -f ".next/static/$build_id/_buildManifest.js"
          curl --fail --silent --show-error "http://127.0.0.1:3000/_next/static/$build_id/_buildManifest.js" -o "$ATTEMPT_DIR/served-build-manifest.js"
          cmp ".next/static/$build_id/_buildManifest.js" "$ATTEMPT_DIR/served-build-manifest.js"
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$ATTEMPT_DIR/browser.json"
          set +e
          npx playwright test --project=webkit-mobile --workers=1 --retries=0 --forbid-only --reporter=list,json --output="$ATTEMPT_DIR/artifacts" > "$ATTEMPT_DIR/browser.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$ATTEMPT_DIR/browser-exit-code.txt"
          exit "$result"
      - name: Audit the complete profile
        if: always()
        run: node scripts/qa/webkit-mobile-v11-profile.mjs audit "$ATTEMPT_DIR"
      - name: Preserve this attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-mobile-v11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ATTEMPT_DIR }}
          if-no-files-found: error
          retention-days: 30
