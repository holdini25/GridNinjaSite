name: Ubuntu 26 native sandbox capability

# One purpose-bound push, one attempt, no website matrix or deployment.
on:
  push:
    branches: [codex/qualification-compatibility]

permissions:
  contents: read

concurrency:
  group: qualification-compatibility-codex-qualification-compatibility
  cancel-in-progress: false

jobs:
  native-capability:
    if: >-
      github.repository == 'holdini25/GridNinjaSite' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.before == 'dab22222b66f5732a87dfde04d1c54569fcc960b'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      GN_NATIVE_PARENT: ${{ github.event.before }}
      GN_NATIVE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      GN_NATIVE_OBSERVER_SHA256: 3414ac3d2813dc052a1bd94e6b7c5c0ca0c9dd5e4878aaddc0f49906647ed5d4
      FACILITY_EXPECTED_CHROME_VERSION: "155.0.8059.79"
      FACILITY_CHROME_EXECUTABLE_PATH: /var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome
      CHROME_PATH: /var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
      - name: Bind frozen source and one permitted attempt
        run: python3 -I -B scripts/qa/qualification-native-workflow.py bind
      - name: Install unchanged root dependencies without lifecycle scripts
        timeout-minutes: 5
        run: python3 -I -B scripts/qa/qualification-native-workflow.py install-root
      - name: Install the exact isolated qualification toolchain
        timeout-minutes: 5
        run: python3 -I -B scripts/qa/qualification-native-workflow.py install-tools
      - name: Download and verify the fixed official Chrome archive
        timeout-minutes: 3
        run: python3 -I -B scripts/qa/qualification-native-workflow.py download
      - name: Observe one native sandbox smoke per launcher and cleanup
        timeout-minutes: 5
        run: node scripts/facility/qualification-native-smoke.mjs
      - name: Report scope boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'GN_NATIVE_SCOPE {"fullMatrixStarted":false,"artifactUploaded":false,"deploymentAttempted":false,"automaticRetry":false}'
