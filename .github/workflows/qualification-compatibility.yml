name: Qualification toolchain compatibility evaluation

# One reviewed branch push authorizes one evaluation. Workflow reruns are refused.
# This is software CI evidence, never hosted/public or physical-device acceptance.
on:
  push:
    branches: [codex/qualification-compatibility]

permissions:
  contents: read

concurrency:
  group: qualification-compatibility-codex-qualification-compatibility
  cancel-in-progress: false

jobs:
  fixed-software-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FACILITY_BASE_URL: http://localhost:3000
      FACILITY_QUALIFICATION_ENVIRONMENT: local
      FACILITY_MEASUREMENT_SCOPE: ci-functional
      FACILITY_PERFORMANCE_MATRIX: premium-civic
      FACILITY_RUNS: "5"
      FACILITY_EXPECTED_CHROME_VERSION: "155.0.8059.79"
      FACILITY_PERFORMANCE_DIR: build/facility/qualification-compatibility
      FACILITY_REPORT_DIR: build/facility/qualification-compatibility
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      GN_COMPATIBILITY_EVIDENCE: build/qa/qualification-compatibility
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/qualification/package-lock.json
      - name: Bind the one permitted run to its exact source
        id: source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          const directory = process.env.GN_COMPATIBILITY_EVIDENCE;
          await mkdir("build/qa", { recursive: true });
          await mkdir(directory);
          const git = args => execFileSync("git", args, { encoding: "utf8" }).trim();
          const baseline = "e49a16e9f7f5c5000eea56bafa1c7c3bf75fa1eb";
          const receipt = {
            classification: "prespecified-compatibility-software-evaluation",
            publicAcceptance: false, hardwareQualification: false,
            event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            expectedHead: process.env.EXPECTED_HEAD, head: git(["rev-parse", "HEAD"]),
            baseline, tree: git(["rev-parse", "HEAD^{tree}"]), node: process.version,
            requestedMatrix: { lighthouse: 140, fullScroll: 140, readiness: 20, runs: 5 },
            replacementPolicy: "Existing capture policy unchanged; no workflow or collector rerun.",
            recordedAt: new Date().toISOString(),
          };
          await writeFile(directory + "/source-request.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" });
          assert.equal(receipt.event, "push");
          assert.equal(receipt.ref, "refs/heads/codex/qualification-compatibility");
          assert.equal(receipt.runAttempt, "1", "An unchanged workflow rerun is not authorized");
          assert.match(receipt.expectedHead, /^[a-f0-9]{40}$/);
          assert.equal(receipt.head, receipt.expectedHead);
          assert.equal(process.version, "v22.23.2");
          assert.equal(process.platform, "linux");
          assert.equal(process.arch, "x64");
          git(["merge-base", "--is-ancestor", baseline, "HEAD"]);
          assert.equal(git(["diff", "--name-only", baseline, "--", "src", "public", "drizzle", "package.json", "package-lock.json", "next.config.ts", "tsconfig.json", "postcss.config.mjs"]), "", "Frozen application or root dependency inputs changed");
          const workflowChanges = git(["diff", "--name-only", baseline, "--", ".github/workflows"]).split("\n").filter(Boolean);
          assert.deepEqual(workflowChanges, [".github/workflows/qualification-compatibility.yml"], "Existing workflows changed");
          const original = JSON.parse(execFileSync("git", ["show", baseline + ":vercel.json"], { encoding: "utf8" }));
          original.git.deploymentEnabled["codex/qualification-compatibility"] = false;
          assert.equal(await readFile("vercel.json", "utf8"), JSON.stringify(original, null, 2) + "\n", "Only the exact compatibility branch deployment disable is permitted");
          for (const key of ["VERCEL", "FACILITY_ANGLE", "FACILITY_HOSTED_ATTESTATION_FILE", "FACILITY_PUBLIC_PRODUCTION_PINS_FILE", "FACILITY_HOSTED_BYPASS_SECRET", "VERCEL_AUTOMATION_BYPASS_SECRET", "FACILITY_LIGHTHOUSE_PRIORITY_ONLY", "FACILITY_LIGHTHOUSE_DIAGNOSTIC", "FACILITY_LIGHTHOUSE_STOP_ON_FAILURE"]) assert(!process.env[key], "Unexpected measurement configuration: " + key);
          assert.equal(process.env.NEXT_PUBLIC_TURNSTILE_SITE_KEY, "");
          const files = {};
          for (const path of ["package.json", "package-lock.json", "tools/qualification/package.json", "tools/qualification/package-lock.json", "vercel.json", ".github/workflows/qualification-compatibility.yml"]) {
            const bytes = await readFile(path);
            files[path] = { bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          }
          await writeFile(directory + "/source-verified.json", JSON.stringify({ ...receipt, result: "verified", files }, null, 2) + "\n", { flag: "wx" });
          NODE
      - name: Install the unchanged application dependencies
        shell: bash
        run: npm ci --no-audit --no-fund 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/npm-ci-root.log"
      - name: Install the isolated qualification toolchain without lifecycle scripts
        shell: bash
        run: npm ci --prefix tools/qualification --ignore-scripts --no-audit --no-fund 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/npm-ci-qualification.log"
      - name: Install browser OS dependencies
        shell: bash
        run: npm exec --no -- playwright install-deps chromium 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/browser-os-dependencies.log"
      - name: Download the exact official Chrome for Testing binary
        shell: bash
        run: |
          chrome_directory="$RUNNER_TEMP/gridninja-cft-155.0.8059.79"
          mkdir "$chrome_directory"
          chrome_archive="$chrome_directory/chrome-linux64.zip"
          chrome_url="https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.79/linux64/chrome-linux64.zip"
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --max-time 120 --output "$chrome_archive" "$chrome_url"
          unzip -q "$chrome_archive" -d "$chrome_directory"
          export GN_CFT_ARCHIVE="$chrome_archive"
          export GN_CFT_URL="$chrome_url"
          export GN_CFT_BINARY="$chrome_directory/chrome-linux64/chrome"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { appendFile, readFile, realpath, writeFile } from "node:fs/promises";
          const executable = await realpath(process.env.GN_CFT_BINARY);
          const version = execFileSync(executable, ["--version"], { encoding: "utf8", timeout: 10000 }).trim();
          assert.equal(version, "Google Chrome for Testing 155.0.8059.79");
          const hash = async path => {
            const bytes = await readFile(path);
            return { bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          };
          const receipt = { source: process.env.GN_CFT_URL, version, executable, archive: await hash(process.env.GN_CFT_ARCHIVE), binary: await hash(executable), recordedAt: new Date().toISOString() };
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE + "/browser-download.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" });
          assert(!/[\r\n]/.test(executable));
          await appendFile(process.env.GITHUB_ENV, "CHROME_PATH=" + executable + "\nFACILITY_CHROME_EXECUTABLE_PATH=" + executable + "\n");
          NODE
      - name: Record installed toolchain and unchanged collection settings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { createHash } from "node:crypto";
          import { readFile, realpath, writeFile } from "node:fs/promises";
          import { harnessRevision, sourceSnapshot } from "./scripts/facility/performance-contract.mjs";
          const require = createRequire(import.meta.url);
          const manifest = JSON.parse(await readFile("tools/qualification/package.json", "utf8"));
          const isolated = {};
          for (const name of ["lighthouse", "puppeteer-core", "chrome-launcher"]) {
            const path = "tools/qualification/node_modules/" + name + "/package.json";
            const bytes = await readFile(path), installed = JSON.parse(bytes);
            assert.equal(installed.version, manifest.dependencies[name], "Installed isolated package differs from exact manifest pin: " + name);
            isolated[name] = { version: installed.version, packageSha256: createHash("sha256").update(bytes).digest("hex") };
          }
          assert.deepEqual(manifest.dependencies, { lighthouse: "13.5.0", "puppeteer-core": "25.13.0", "chrome-launcher": "1.2.2" });
          assert.equal(await realpath(process.env.CHROME_PATH), await realpath(process.env.FACILITY_CHROME_EXECUTABLE_PATH));
          const rootLighthouse = JSON.parse(await readFile(require.resolve("lighthouse/package.json"), "utf8"));
          assert.equal(rootLighthouse.version, "12.6.1", "Root application dependency changed");
          const source = await sourceSnapshot();
          const receipt = { recordedAt: new Date().toISOString(), node: process.version, rootLighthouse: rootLighthouse.version, isolated, browserExecutable: process.env.CHROME_PATH, source, harnessRevision: await harnessRevision(), lighthouseConfiguration: require("./scripts/facility/lighthouse.cjs").ci.collect, qualificationEnvironment: process.env.FACILITY_QUALIFICATION_ENVIRONMENT, measurementScope: process.env.FACILITY_MEASUREMENT_SCOPE, matrix: process.env.FACILITY_PERFORMANCE_MATRIX, runs: Number(process.env.FACILITY_RUNS), verification: "unconfigured-local", hardwareQualification: false, publicAcceptance: false };
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE + "/toolchain-settings.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" });
          NODE
      - name: Build the frozen application with the existing local CI configuration
        shell: bash
        run: npm run build 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/build.log"
      - name: Run each full-matrix collector and validator once, sequentially
        shell: bash
        run: |
          mkdir -p build/facility
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$GN_COMPATIBILITY_EVIDENCE/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$GN_COMPATIBILITY_EVIDENCE/server.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ >/dev/null
          failed=0
          run_once() {
            label="$1"
            shift
            status=0
            "$@" > "$GN_COMPATIBILITY_EVIDENCE/$label.log" 2>&1 || status=$?
            printf '%s\t%s\n' "$label" "$status" >> "$GN_COMPATIBILITY_EVIDENCE/command-exit-status.tsv"
            if [ "$status" -ne 0 ]; then failed=1; fi
          }
          run_once page-measurements npm run facility:measure
          run_once functional-validation node scripts/facility/validate-ci-functional.mjs
          run_once lighthouse npm run facility:lighthouse
          run_once performance-summary npm run facility:performance:validate
          exit "$failed"
      - name: Retain final source state and artifact identities, including failures
        if: ${{ always() && steps.source.outcome == 'success' }}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readdir, readFile, stat, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          const directory = process.env.GN_COMPATIBILITY_EVIDENCE;
          const git = args => execFileSync("git", args, { encoding: "utf8" }).trim();
          const before = JSON.parse(await readFile(directory + "/source-verified.json", "utf8"));
          const changes = git(["status", "--porcelain", "--untracked-files=no"]);
          const pins = {}, artifacts = [];
          for (const path of Object.keys(before.files)) {
            const bytes = await readFile(path);
            pins[path] = { bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          }
          async function walk(path) {
            const entry = await stat(path).catch(() => null);
            if (!entry) return;
            if (entry.isDirectory()) { for (const name of (await readdir(path)).sort()) await walk(join(path, name)); return; }
            if (!entry.isFile()) return;
            const bytes = await readFile(path);
            artifacts.push({ path, bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") });
          }
          await walk("build/facility");
          await walk(directory);
          await walk(".next/facility-build.json");
          await walk(".next/BUILD_ID");
          const head = git(["rev-parse", "HEAD"]);
          await writeFile(directory + "/final-evidence-index.json", JSON.stringify({ recordedAt: new Date().toISOString(), head, expectedHead: process.env.EXPECTED_HEAD, trackedChanges: changes, sourcePins: pins, artifacts, interpretation: "Exit statuses and complete-matrix validators determine the evaluation result. Collection or artifact-upload success alone is not qualification. Original invalid captures remain retained.", hardwareQualification: false, publicAcceptance: false }, null, 2) + "\n", { flag: "wx" });
          assert.equal(head, process.env.EXPECTED_HEAD);
          assert.equal(changes, "", "Tracked source changed during the evaluation");
          assert.deepEqual(pins, before.files, "Frozen source or lockfile pins changed during the evaluation");
          NODE
      - name: Upload every available result and raw failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-compatibility-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/qa/qualification-compatibility
            build/facility
            .next/facility-build.json
            .next/BUILD_ID
            tools/qualification/package.json
            tools/qualification/package-lock.json
            .github/workflows/qualification-compatibility.yml
            vercel.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
