name: Qualification attachment diagnostic

# Read-only diagnostic. The qualification workflow at 78665882 is preserved.
# One purpose-bound push; no browser, policy change, trial rerun, or deployment.
on:
  push:
    branches: [codex/qualification-compatibility]

permissions: {}

concurrency:
  group: qualification-compatibility-codex-qualification-compatibility
  cancel-in-progress: false

jobs:
  attachment-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GN_PARENT: ${{ github.event.before }}
      GN_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Identify unresolved attachments and loaded-policy identity
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          """One reviewed read-only AppArmor attachment diagnostic; no qualification."""
          import base64
          import hashlib
          import json
          import os
          import re
          import selectors
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone

          COLLECTOR_B64 = ""
          COLLECTOR_SHA256 = "b5d007f3cfcddb4c350f06d0f3097ca2a95f80c17012e6a1c2979ecf77fd0d76"
          PARENT = "78665882fac61e1be933e467eea999f33e42a041"
          REF = "refs/heads/codex/qualification-compatibility"
          LIMIT = 262144
          BOOTSTRAP = """import hashlib,sys
          payload=sys.stdin.buffer.read(262145)
          if len(payload)>262144 or len(sys.argv)!=2 or hashlib.sha256(payload).hexdigest()!=sys.argv[1]:
           sys.stdout.write('{"diagnosticOnly":true,"collisionResolved":false,"qualification":false,"error":"bootstrap-integrity"}\\n')
           sys.exit(1)
          sys.argv=['<reviewed-attachment-diagnostic>']
          exec(compile(payload,"<reviewed-attachment-diagnostic>","exec"),{"__name__":"__main__","__file__":"<reviewed-attachment-diagnostic>","__package__":None})
          """
          RULES = {
              "ImageOS": r"ubuntu24",
              "ImageVersion": r"[0-9]{8}\.[0-9]{1,8}\.[0-9]{1,8}",
              "RUNNER_OS": r"Linux", "RUNNER_ARCH": r"X64", "RUNNER_ENVIRONMENT": r"github-hosted",
              "GITHUB_RUN_ID": r"[0-9]{1,20}", "GITHUB_RUN_ATTEMPT": r"1",
              "GITHUB_SHA": r"[a-f0-9]{40}", "GITHUB_REF": re.escape(REF),
              "GITHUB_EVENT_NAME": r"push",
          }

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def observer():
              result = {"uid": os.getuid(), "euid": os.geteuid(), "namespaces": {}}
              try:
                  with open("/proc/self/attr/current", "rb") as handle:
                      data = handle.read(8193)
                  result["label"] = {"bytes": len(data), "sha256": digest(data),
                                     "complete": len(data) <= 8192,
                                     "unconfined": data.strip() == b"unconfined"}
              except OSError:
                  result["label"] = {"available": False}
              for key, path in (("policyNamespaceName", "/sys/kernel/security/apparmor/.ns_name"),
                                ("policyNamespaceLevel", "/sys/kernel/security/apparmor/.ns_level"),
                                ("policyNamespaceStacked", "/sys/kernel/security/apparmor/.ns_stacked"),
                                ("policyStacked", "/sys/kernel/security/apparmor/.stacked")):
                  try:
                      with open(path, "rb") as handle:
                          data = handle.read(8193)
                      result[key] = {"bytes":len(data),"sha256":digest(data),"complete":len(data)<=8192}
                  except OSError:
                      result[key] = {"available":False}
              for name in ("user", "mnt", "pid", "net"):
                  try:
                      data = os.readlink("/proc/self/ns/" + name).encode()
                      result["namespaces"][name] = {"sha256": digest(data), "bytes": len(data)}
                  except OSError:
                      result["namespaces"][name] = {"available": False}
              return result

          def compare_context(ordinary, elevated):
              checks = {}
              for key in ("label", "policyNamespaceName", "policyNamespaceLevel", "policyNamespaceStacked", "policyStacked"):
                  left, right = ordinary.get(key, {}), elevated.get(key, {})
                  checks[key] = (left.get("sha256") == right.get("sha256") and left.get("bytes") == right.get("bytes")) if left.get("complete") is True and right.get("status") == "available" else None
              for name in ("user", "mnt", "pid", "net"):
                  left = ordinary.get("namespaces", {}).get(name, {})
                  right = elevated.get("processNamespaces", {}).get(name, {})
                  checks[name] = (left["sha256"] == digest(right["identity"].encode())) if "sha256" in left and right.get("status") == "available" and isinstance(right.get("identity"), str) else None
              return {"checks":checks,"equivalent":all(v is True for v in checks.values()),
                      "status":"MATCH" if all(v is True for v in checks.values()) else "MISMATCH" if any(v is False for v in checks.values()) else "UNAVAILABLE"}

          def emit(record):
              encoded = (json.dumps(record, ensure_ascii=True, separators=(",", ":")).replace("#", "\\u0023").replace("::", "\\u003a\\u003a") + "\n").encode("ascii")
              within_bound = len(encoded) <= LIMIT
              if not within_bound:
                  encoded = b'{"diagnosticOnly":true,"collisionResolved":false,"qualification":false,"error":"wrapper-output-limit"}\n'
              sys.stdout.buffer.write(encoded)
              sys.stdout.buffer.flush()
              return within_bound

          def capture(command, payload, seconds=45):
              """Finite local pipe handling; never wait for descendant closure or signal root."""
              proc = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  env={"PATH":"/usr/sbin:/usr/bin:/sbin:/bin","LANG":"C","LC_ALL":"C"})
              selector = selectors.DefaultSelector()
              outputs = {"stdout": bytearray(), "stderr": bytearray()}
              offset = 0
              reason = None
              deadline = time.monotonic() + seconds
              try:
                  for stream, event, name in ((proc.stdin, selectors.EVENT_WRITE, "stdin"),
                                              (proc.stdout, selectors.EVENT_READ, "stdout"),
                                              (proc.stderr, selectors.EVENT_READ, "stderr")):
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, event, name)
                  while selector.get_map() or proc.poll() is None:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          reason = "TIMEOUT_CLOSURE_UNCONFIRMED"
                          break
                      for key, _ in selector.select(min(remaining, 0.2)):
                          if key.data == "stdin":
                              try:
                                  offset += os.write(key.fd, payload[offset:offset + 8192])
                              except BrokenPipeError:
                                  offset = len(payload)
                              if offset == len(payload):
                                  selector.unregister(key.fileobj)
                                  key.fileobj.close()
                          else:
                              bound = LIMIT if key.data == "stdout" else 8192
                              chunk = os.read(key.fd, min(8192, bound + 1 - len(outputs[key.data])))
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  key.fileobj.close()
                              else:
                                  outputs[key.data].extend(chunk)
                                  if len(outputs[key.data]) > bound:
                                      reason = "OUTPUT_BOUND_EXCEEDED"
                                      break
                      if reason:
                          break
              finally:
                  for key in list(selector.get_map().values()):
                      selector.unregister(key.fileobj)
                      key.fileobj.close()
                  selector.close()
              return {"returncode":proc.poll(),"stdout":bytes(outputs["stdout"]),"stderr":bytes(outputs["stderr"]),
                      "reason":reason,"closureConfirmed":reason is None and proc.poll() is not None}

          def main():
              metadata = {key: os.environ.get(key, "") for key in RULES}
              valid = all(re.fullmatch(RULES[key], value) for key, value in metadata.items())
              valid = valid and os.environ.get("GN_PARENT") == PARENT
              valid = valid and os.environ.get("GN_WORKFLOW_SHA") == metadata["GITHUB_SHA"]
              valid = valid and os.environ.get("GITHUB_REPOSITORY") == "holdini25/GridNinjaSite"
              valid = valid and sys.platform == "linux" and os.geteuid() != 0
              if not valid:
                  emit({"kind":"guard-failure","diagnosticOnly":True,"collisionResolved":False,"qualification":False})
                  return 1
              payload = base64.b64decode(COLLECTOR_B64, validate=True)
              if len(payload) > 262144 or digest(payload) != COLLECTOR_SHA256:
                  emit({"kind":"source-integrity-failure","diagnosticOnly":True,"collisionResolved":False,"qualification":False})
                  return 1
              record = {"kind": "attachment-diagnostic", "diagnosticOnly": True, "collisionResolved": False,
                        "qualification": False, "matchingProofStatus": "NOT_ATTEMPTED",
                        "metadata": metadata, "parent": PARENT, "workflowSha": metadata["GITHUB_SHA"],
                        "collectorSha256": COLLECTOR_SHA256, "bootstrapSha256": digest(BOOTSTRAP.encode()),
                        "hostPhase": "fresh-runner-before-package-installation",
                        "historicalHostEquivalence": False, "ordinaryObserver": observer(),
                        "startedAt": datetime.now(timezone.utc).isoformat()}
              try:
                  completed = capture(
                      ["sudo", "-n", "/usr/bin/python3", "-I", "-B", "-c", BOOTSTRAP, COLLECTOR_SHA256],
                      payload)
                  record["exitCode"] = completed["returncode"]
                  record["closureConfirmed"] = completed["closureConfirmed"]
                  record["stdoutBytes"] = len(completed["stdout"])
                  record["stdoutSha256"] = digest(completed["stdout"])
                  record["stderrBytes"] = len(completed["stderr"])
                  record["stderrSha256"] = digest(completed["stderr"])
                  if completed["reason"]:
                      record["collectorStatus"] = completed["reason"]
                  else:
                      try:
                          result = json.loads(completed["stdout"])
                          if not isinstance(result, dict) or result.get("diagnosticOnly") is not True or result.get("collisionResolved") is not False or result.get("qualification") is not False:
                              raise ValueError("invalid-schema")
                          record["collector"] = result
                          record["collectorStatus"] = "RETURNED"
                          record["observerContextComparison"] = compare_context(record["ordinaryObserver"], result.get("observerBefore", {}))
                      except (UnicodeError, ValueError):
                          record["collectorStatus"] = "INVALID_RESULT"
              except OSError:
                  record["collectorStatus"] = "EXEC_UNAVAILABLE"
              record["ordinaryObserverAfter"] = observer()
              record["ordinaryContextStable"] = record["ordinaryObserver"] == record["ordinaryObserverAfter"]
              context_confirmed = record["ordinaryContextStable"] and record.get("observerContextComparison", {}).get("status") == "MATCH"
              record["observationContextStatus"] = "CONFIRMED" if context_confirmed else "CONTEXT_UNCONFIRMED"
              record["finishedAt"] = datetime.now(timezone.utc).isoformat()
              emitted = emit(record)
              return 0 if emitted and context_confirmed and record.get("collectorStatus") == "RETURNED" and record.get("exitCode") == 0 else 1

          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception:
                  emit({"kind":"fatal","diagnosticOnly":True,"collisionResolved":False,"qualification":False,"detailsSuppressed":True})
                  sys.exit(1)

          PY
