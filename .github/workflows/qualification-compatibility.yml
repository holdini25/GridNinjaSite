      - name: Preserve typed root-owned trial state even after a failed gate
        id: sandbox_state
        if: ${{ always() && steps.source.outcome == 'success' && steps.provision.outcome != 'skipped' }}
        timeout-minutes: 2
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          node --input-type=module <<'CAPTURE_STATE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstat, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
          const records={};
          const root="/var/lib/gridninja-cft";
          const rootMetadata=await lstat(root).catch(()=>null);
          if (rootMetadata) assert(rootMetadata.isDirectory()&&!rootMetadata.isSymbolicLink()&&rootMetadata.uid===0);
          const commandNames=rootMetadata?(await readdir(root)).filter(name=>/^command-intent-[0-9]{3}(?:-closed)?[.]json$/.test(name)).sort():[];
          assert(commandNames.length<=64);
          for (const name of ["trial-state.json","activation-intent.json","activation.json","finalized.json",...commandNames]) {
            const path="/var/lib/gridninja-cft/"+name;
            const metadata=await lstat(path).catch(()=>null);
            if (!metadata) {records[name]={available:false};continue;}
            assert(metadata.isFile()&&!metadata.isSymbolicLink()&&metadata.uid===0&&metadata.size<=2097152);
            const bytes=await readFile(path);
            records[name]={available:true,sha256:createHash("sha256").update(bytes).digest("hex"),value:JSON.parse(bytes)};
          }
          await mkdir(process.env.GN_COMPATIBILITY_EVIDENCE+"/sandbox-trial",{recursive:true});
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE+"/sandbox-trial/root-state-export.json",JSON.stringify({head:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,records},null,2)+"\n",{flag:"wx"});
          CAPTURE_STATE
      - name: Retain final source state and artifact identities, including failures
        if: ${{ always() && steps.source.outcome == 'success' }}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readdir, readFile, stat, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          const directory = process.env.GN_COMPATIBILITY_EVIDENCE;
          const git = args => execFileSync("git", args, { encoding: "utf8" }).trim();
          const before = JSON.parse(await readFile(directory + "/source-verified.json", "utf8"));
          const changes = git(["status", "--porcelain", "--untracked-files=no"]);
          const pins = {}, artifacts = [];
          for (const path of Object.keys(before.files)) {
            const bytes = await readFile(path);
            pins[path] = { bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          }
          async function walk(path) {
            const entry = await stat(path).catch(() => null);
            if (!entry) return;
            if (entry.isDirectory()) { for (const name of (await readdir(path)).sort()) await walk(join(path, name)); return; }
            if (!entry.isFile()) return;
            const bytes = await readFile(path);
            artifacts.push({ path, bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") });
          }
          await walk("build/facility");
          await walk(directory);
          await walk(".next/facility-build.json");
          await walk(".next/BUILD_ID");
          const head = git(["rev-parse", "HEAD"]);
          await writeFile(directory + "/final-evidence-index.json", JSON.stringify({ recordedAt: new Date().toISOString(), head, expectedHead: process.env.EXPECTED_HEAD, trackedChanges: changes, sourcePins: pins, artifacts, interpretation: "Exit statuses and complete-matrix validators determine the evaluation result. Collection or artifact-upload success alone is not qualification. Original invalid captures remain retained.", hardwareQualification: false, publicAcceptance: false }, null, 2) + "\n", { flag: "wx" });
          assert.equal(head, process.env.EXPECTED_HEAD);
          assert.equal(changes, "", "Tracked source changed during the evaluation");
          assert.deepEqual(pins, before.files, "Frozen source or lockfile pins changed during the evaluation");
          NODE
      - name: Upload every available result and raw failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qualification-compatibility-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            build/qa/qualification-compatibility
            build/facility
            .next/facility-build.json
            .next/BUILD_ID
            tools/qualification/package.json
            tools/qualification/package-lock.json
            .github/workflows/qualification-compatibility.yml
            vercel.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
