name: Scoped sandbox trial and fixed qualification

# One reviewed branch push authorizes one evaluation. Workflow reruns are refused.
# This is software CI evidence, never hosted/public or physical-device acceptance.
on:
  push:
    branches: [codex/qualification-compatibility]

permissions:
  contents: read

concurrency:
  group: qualification-compatibility-codex-qualification-compatibility
  cancel-in-progress: false

jobs:
  fixed-software-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FACILITY_BASE_URL: http://localhost:3000
      FACILITY_QUALIFICATION_ENVIRONMENT: local
      FACILITY_MEASUREMENT_SCOPE: ci-functional
      FACILITY_PERFORMANCE_MATRIX: premium-civic
      FACILITY_RUNS: "5"
      FACILITY_EXPECTED_CHROME_VERSION: "155.0.8059.79"
      FACILITY_PERFORMANCE_DIR: build/facility/qualification-compatibility
      FACILITY_REPORT_DIR: build/facility/qualification-compatibility
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      GN_COMPATIBILITY_EVIDENCE: build/qa/qualification-compatibility
      GN_TRIAL_PARENT: ${{ github.event.before }}
      GN_TRIAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/qualification/package-lock.json
      - name: Bind the one permitted run to its exact source
        id: source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          const directory = process.env.GN_COMPATIBILITY_EVIDENCE;
          await mkdir("build/qa", { recursive: true });
          await mkdir(directory);
          const git = args => execFileSync("git", args, { encoding: "utf8" }).trim();
          const baseline = "e49a16e9f7f5c5000eea56bafa1c7c3bf75fa1eb";
          const receipt = {
            classification: "prespecified-compatibility-software-evaluation",
            publicAcceptance: false, hardwareQualification: false,
            event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            expectedHead: process.env.EXPECTED_HEAD, head: git(["rev-parse", "HEAD"]),
            baseline, tree: git(["rev-parse", "HEAD^{tree}"]), node: process.version,
            requestedMatrix: { lighthouse: 140, fullScroll: 140, readiness: 20, runs: 5 },
            replacementPolicy: "Existing capture policy unchanged; no workflow or collector rerun.",
            recordedAt: new Date().toISOString(),
          };
          await writeFile(directory + "/source-request.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" });
          assert.equal(receipt.event, "push");
          assert.equal(receipt.ref, "refs/heads/codex/qualification-compatibility");
          assert.equal(receipt.runAttempt, "1", "An unchanged workflow rerun is not authorized");
          assert.match(receipt.expectedHead, /^[a-f0-9]{40}$/);
          assert.equal(receipt.head, receipt.expectedHead);
          assert.equal(process.env.GN_TRIAL_PARENT, "5e87a67182d12b525a9b2355d151cfc63ec7e8ea");
          assert.equal(process.env.GN_TRIAL_WORKFLOW_SHA, receipt.head);
          assert.equal(git(["rev-parse", "HEAD^"]), process.env.GN_TRIAL_PARENT);
          assert.equal(process.version, "v22.23.2");
          assert.equal(process.platform, "linux");
          assert.equal(process.arch, "x64");
          git(["merge-base", "--is-ancestor", baseline, "HEAD"]);
          assert.equal(git(["diff", "--name-only", baseline, "--", "src", "public", "drizzle", "package.json", "package-lock.json", "next.config.ts", "tsconfig.json", "postcss.config.mjs"]), "", "Frozen application or root dependency inputs changed");
          const workflowChanges = git(["diff", "--name-only", baseline, "--", ".github/workflows"]).split("\n").filter(Boolean);
          assert.deepEqual(workflowChanges, [".github/workflows/qualification-compatibility.yml"], "Existing workflows changed");
          const original = JSON.parse(execFileSync("git", ["show", baseline + ":vercel.json"], { encoding: "utf8" }));
          original.git.deploymentEnabled["codex/qualification-compatibility"] = false;
          assert.equal(await readFile("vercel.json", "utf8"), JSON.stringify(original, null, 2) + "\n", "Only the exact compatibility branch deployment disable is permitted");
          for (const key of ["VERCEL", "FACILITY_ANGLE", "FACILITY_HOSTED_ATTESTATION_FILE", "FACILITY_PUBLIC_PRODUCTION_PINS_FILE", "FACILITY_HOSTED_BYPASS_SECRET", "VERCEL_AUTOMATION_BYPASS_SECRET", "FACILITY_LIGHTHOUSE_PRIORITY_ONLY", "FACILITY_LIGHTHOUSE_DIAGNOSTIC", "FACILITY_LIGHTHOUSE_STOP_ON_FAILURE"]) assert(!process.env[key], "Unexpected measurement configuration: " + key);
          assert.equal(process.env.NEXT_PUBLIC_TURNSTILE_SITE_KEY, "");
          const files = {};
          for (const path of ["package.json", "package-lock.json", "tools/qualification/package.json", "tools/qualification/package-lock.json", "vercel.json", ".github/workflows/qualification-compatibility.yml", "scripts/facility/qualification-sandbox-provision.py", "scripts/facility/qualification-sandbox-proof.mjs", "scripts/facility/qualification-playwright.mjs"]) {
            const bytes = await readFile(path);
            files[path] = { bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          }
          await writeFile(directory + "/source-verified.json", JSON.stringify({ ...receipt, result: "verified", files }, null, 2) + "\n", { flag: "wx" });
          NODE
      - name: Install the unchanged application dependencies
        shell: bash
        run: npm ci --no-audit --no-fund 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/npm-ci-root.log"
      - name: Install the isolated qualification toolchain without lifecycle scripts
        shell: bash
        run: npm ci --prefix tools/qualification --ignore-scripts --no-audit --no-fund 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/npm-ci-qualification.log"
      - name: Install browser OS dependencies
        shell: bash
        run: npm exec --no -- playwright install-deps chromium 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/browser-os-dependencies.log"
      - name: Verify the reviewed pure sandbox guards before provisioning
        timeout-minutes: 5
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          python3 -I -B scripts/qa/qualification-sandbox-provision.test.py 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/provision-guard-tests.log"
          node --test scripts/qa/qualification-sandbox-proof.test.mjs 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/proof-guard-tests.log"
          node node_modules/vitest/vitest.mjs run tests/unit/facility/qualification-*.test.ts tests/unit/facility/native-lcp-evidence.test.ts --coverage.enabled=false 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/qualification-unit-tests.log"
      - name: Download and verify the exact official Chrome archive
        timeout-minutes: 4
        shell: bash
        run: |
          chrome_directory="$RUNNER_TEMP/gridninja-cft-155.0.8059.79"
          mkdir "$chrome_directory"
          chrome_archive="$chrome_directory/chrome-linux64.zip"
          chrome_url="https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.79/linux64/chrome-linux64.zip"
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --max-time 120 --output "$chrome_archive" "$chrome_url"
          export GN_CFT_ARCHIVE="$chrome_archive"
          export GN_CFT_URL="$chrome_url"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { appendFile, lstat, readFile, realpath, writeFile } from "node:fs/promises";
          const archive = process.env.GN_CFT_ARCHIVE;
          assert((await lstat(archive)).isFile());
          assert.equal(await realpath(archive), archive);
          const bytes = await readFile(archive);
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          assert.equal(sha256, "bcd9a79130d7e44d70f93be87042e9bcee7fe0f0b3898e06b8c9bed5fb619dcd");
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE + "/browser-archive.json", JSON.stringify({ source: process.env.GN_CFT_URL, archive, bytes: bytes.length, sha256, recordedAt: new Date().toISOString(), executed: false }, null, 2) + "\n", { flag: "wx" });
          assert(!/[\r\n]/.test(archive));
          await appendFile(process.env.GITHUB_ENV, "GN_CFT_ARCHIVE=" + archive + "\n");
          NODE
      - name: Verify fresh host policy and provision only the protected pinned browser
        id: provision
        timeout-minutes: 5
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'SOURCE_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          for (const [path,expected] of [["scripts/facility/qualification-sandbox-provision.py",process.env.GN_SANDBOX_PROVISION_SHA256],["scripts/facility/qualification-sandbox-proof.mjs",process.env.GN_SANDBOX_PROOF_SHA256]]) {
            assert.equal(createHash("sha256").update(await readFile(path)).digest("hex"),expected);
          }
          SOURCE_BINDING
          sandbox_control() {
            test ! -e "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/helper-uncertain.json" || return 1
            local call_directory status
            call_directory=$(python3 -I - "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/control-calls" "$1" <<'CONTROL_INTENT'
          import json,os,pathlib,sys,tempfile,time
          root=pathlib.Path(sys.argv[1])
          root.mkdir(exist_ok=True)
          assert not root.is_symlink()
          for prior in root.iterdir():
              assert prior.is_dir() and not prior.is_symlink()
              assert (prior/'terminal.json').is_file(), 'Earlier privileged helper closure is uncertain'
              terminal=json.loads((prior/'terminal.json').read_text())
              assert type(terminal.get('observedExitStatus')) is int and type(terminal.get('endedEpochMs')) is int
          directory=pathlib.Path(tempfile.mkdtemp(prefix='call-',dir=root))
          with (directory/'intent.json').open('x') as output:
              json.dump({'action':sys.argv[2],'startedEpochNs':time.time_ns(),'head':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID']},output)
          print(directory)
          CONTROL_INTENT
            ) || return 1
            status=0
            if sudo -n /usr/bin/python3 -I - "$GN_SANDBOX_PROVISION_SHA256" "$GITHUB_WORKSPACE/scripts/facility/qualification-sandbox-provision.py" "$@" <<'VERIFIED_HELPER'
          import hashlib
          import os
          import stat
          import sys

          try:
              expected, source_path, *arguments = sys.argv[1:]
              if len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected):
                  raise ValueError()
              descriptor = os.open(source_path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(descriptor, "rb") as source:
                  metadata = os.fstat(source.fileno())
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 262144:
                      raise ValueError()
                  payload = source.read(262145)
              if len(payload) > 262144 or hashlib.sha256(payload).hexdigest() != expected:
                  raise ValueError()
              code = compile(payload, source_path, "exec")
          except Exception:
              sys.stderr.write("verified-helper-bootstrap-rejected\n")
              sys.exit(1)
          sys.argv = [source_path, *arguments]
          namespace = {"__name__": "__main__", "__file__": source_path, "__package__": None, "__verified_helper_sha256__": hashlib.sha256(payload).hexdigest()}
          exec(code, namespace, namespace)
          VERIFIED_HELPER
            then status=0; else status=$?; fi
            python3 -I - "$call_directory/terminal.json" "$status" <<'CONTROL_TERMINAL'
          import json,pathlib,sys,time
          with pathlib.Path(sys.argv[1]).open('x') as output:
              json.dump({'observedExitStatus':int(sys.argv[2]),'endedEpochMs':time.time_ns()//1000000},output)
          CONTROL_TERMINAL
            return "$status"
          }
          mkdir "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial"
          sandbox_control prepare --archive "$GN_CFT_ARCHIVE" --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --runner-uid "$(id -u)" > "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/prepare-command.json"
          node --input-type=module <<'BROWSER_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { appendFile, readFile, realpath, writeFile } from "node:fs/promises";
          const executable="/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome";
          assert.equal(await realpath(executable),executable);
          const bytes=await readFile(executable),sha256=createHash("sha256").update(bytes).digest("hex");
          assert.equal(sha256,"58957d0e74a9073626131018aabf17d97318227cca9b5dbdf5dee16345f2d211");
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE+"/browser-download.json",JSON.stringify({recordedAt:new Date().toISOString(),executable,binary:{bytes:bytes.length,sha256},versionPin:"155.0.8059.79",versionVerification:"Requires subsequent actual-browser sandbox proof",archiveReceipt:"browser-archive.json",protectedProvisioningReceipt:"sandbox-trial/prepare-command.json"},null,2)+"\n",{flag:"wx"});
          await appendFile(process.env.GITHUB_ENV,"CHROME_PATH="+executable+"\nFACILITY_CHROME_EXECUTABLE_PATH="+executable+"\n");
          BROWSER_BINDING
      - name: Establish the bounded denied baseline and owned process closure
        id: baseline
        timeout-minutes: 6
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'SOURCE_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          for (const [path,expected] of [["scripts/facility/qualification-sandbox-provision.py",process.env.GN_SANDBOX_PROVISION_SHA256],["scripts/facility/qualification-sandbox-proof.mjs",process.env.GN_SANDBOX_PROOF_SHA256]]) {
            assert.equal(createHash("sha256").update(await readFile(path)).digest("hex"),expected);
          }
          SOURCE_BINDING
          node scripts/facility/qualification-sandbox-proof.mjs baseline
      - name: Load only the reviewed exact-executable userns profile
        id: policy
        timeout-minutes: 2
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          sandbox_control() {
            test ! -e "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/helper-uncertain.json" || return 1
            local call_directory status
            call_directory=$(python3 -I - "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/control-calls" "$1" <<'CONTROL_INTENT'
          import json,os,pathlib,sys,tempfile,time
          root=pathlib.Path(sys.argv[1])
          root.mkdir(exist_ok=True)
          assert not root.is_symlink()
          for prior in root.iterdir():
              assert prior.is_dir() and not prior.is_symlink()
              assert (prior/'terminal.json').is_file(), 'Earlier privileged helper closure is uncertain'
              terminal=json.loads((prior/'terminal.json').read_text())
              assert type(terminal.get('observedExitStatus')) is int and type(terminal.get('endedEpochMs')) is int
          directory=pathlib.Path(tempfile.mkdtemp(prefix='call-',dir=root))
          with (directory/'intent.json').open('x') as output:
              json.dump({'action':sys.argv[2],'startedEpochNs':time.time_ns(),'head':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID']},output)
          print(directory)
          CONTROL_INTENT
            ) || return 1
            status=0
            if sudo -n /usr/bin/python3 -I - "$GN_SANDBOX_PROVISION_SHA256" "$GITHUB_WORKSPACE/scripts/facility/qualification-sandbox-provision.py" "$@" <<'VERIFIED_HELPER'
          import hashlib
          import os
          import stat
          import sys

          try:
              expected, source_path, *arguments = sys.argv[1:]
              if len(expected) != 64 or any(c not in "0123456789abcdef" for c in expected):
                  raise ValueError()
              descriptor = os.open(source_path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(descriptor, "rb") as source:
                  metadata = os.fstat(source.fileno())
                  if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > 262144:
                      raise ValueError()
                  payload = source.read(262145)
              if len(payload) > 262144 or hashlib.sha256(payload).hexdigest() != expected:
                  raise ValueError()
              code = compile(payload, source_path, "exec")
          except Exception:
              sys.stderr.write("verified-helper-bootstrap-rejected\n")
              sys.exit(1)
          sys.argv = [source_path, *arguments]
          namespace = {"__name__": "__main__", "__file__": source_path, "__package__": None, "__verified_helper_sha256__": hashlib.sha256(payload).hexdigest()}
          exec(code, namespace, namespace)
          VERIFIED_HELPER
            then status=0; else status=$?; fi
            python3 -I - "$call_directory/terminal.json" "$status" <<'CONTROL_TERMINAL'
          import json,pathlib,sys,time
          with pathlib.Path(sys.argv[1]).open('x') as output:
              json.dump({'observedExitStatus':int(sys.argv[2]),'endedEpochMs':time.time_ns()//1000000},output)
          CONTROL_TERMINAL
            return "$status"
          }
          sandbox_control activate --request "$GITHUB_WORKSPACE/$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/baseline-proof.json" --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" > "$GN_COMPATIBILITY_EVIDENCE/sandbox-trial/activate-command.json"
      - name: Verify Lighthouse browser namespace sandbox and process closure
        id: lighthouse_sandbox
        timeout-minutes: 6
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'SOURCE_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          for (const [path,expected] of [["scripts/facility/qualification-sandbox-provision.py",process.env.GN_SANDBOX_PROVISION_SHA256],["scripts/facility/qualification-sandbox-proof.mjs",process.env.GN_SANDBOX_PROOF_SHA256]]) {
            assert.equal(createHash("sha256").update(await readFile(path)).digest("hex"),expected);
          }
          SOURCE_BINDING
          node scripts/facility/qualification-sandbox-proof.mjs lighthouse
      - name: Verify Playwright namespace sandbox and process closure
        id: playwright_sandbox
        timeout-minutes: 6
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'SOURCE_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          for (const [path,expected] of [["scripts/facility/qualification-sandbox-provision.py",process.env.GN_SANDBOX_PROVISION_SHA256],["scripts/facility/qualification-sandbox-proof.mjs",process.env.GN_SANDBOX_PROOF_SHA256]]) {
            assert.equal(createHash("sha256").update(await readFile(path)).digest("hex"),expected);
          }
          SOURCE_BINDING
          node scripts/facility/qualification-sandbox-proof.mjs playwright
      - name: Record installed toolchain and unchanged collection settings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { createHash } from "node:crypto";
          import { readFile, realpath, writeFile } from "node:fs/promises";
          import { harnessRevision, sourceSnapshot } from "./scripts/facility/performance-contract.mjs";
          const require = createRequire(import.meta.url);
          const manifest = JSON.parse(await readFile("tools/qualification/package.json", "utf8"));
          const isolated = {};
          for (const name of ["lighthouse", "puppeteer-core", "chrome-launcher"]) {
            const path = "tools/qualification/node_modules/" + name + "/package.json";
            const bytes = await readFile(path), installed = JSON.parse(bytes);
            assert.equal(installed.version, manifest.dependencies[name], "Installed isolated package differs from exact manifest pin: " + name);
            isolated[name] = { version: installed.version, packageSha256: createHash("sha256").update(bytes).digest("hex") };
          }
          assert.deepEqual(manifest.dependencies, { lighthouse: "13.5.0", "puppeteer-core": "25.13.0", "chrome-launcher": "1.2.2" });
          assert.equal(await realpath(process.env.CHROME_PATH), await realpath(process.env.FACILITY_CHROME_EXECUTABLE_PATH));
          const rootLighthouse = JSON.parse(await readFile(require.resolve("lighthouse/package.json"), "utf8"));
          assert.equal(rootLighthouse.version, "12.6.1", "Root application dependency changed");
          const source = await sourceSnapshot();
          const receipt = { recordedAt: new Date().toISOString(), node: process.version, rootLighthouse: rootLighthouse.version, isolated, browserExecutable: process.env.CHROME_PATH, source, harnessRevision: await harnessRevision(), lighthouseConfiguration: require("./scripts/facility/lighthouse.cjs").ci.collect, qualificationEnvironment: process.env.FACILITY_QUALIFICATION_ENVIRONMENT, measurementScope: process.env.FACILITY_MEASUREMENT_SCOPE, matrix: process.env.FACILITY_PERFORMANCE_MATRIX, runs: Number(process.env.FACILITY_RUNS), verification: "unconfigured-local", hardwareQualification: false, publicAcceptance: false };
          await writeFile(process.env.GN_COMPATIBILITY_EVIDENCE + "/toolchain-settings.json", JSON.stringify(receipt, null, 2) + "\n", { flag: "wx" });
          NODE
      - name: Build the frozen application with the existing local CI configuration
        shell: bash
        run: npm run build 2>&1 | tee "$GN_COMPATIBILITY_EVIDENCE/build.log"
      - name: Bind both sandbox proofs before the frozen matrix
        id: sandbox_gate
        timeout-minutes: 2
        env:
          GN_SANDBOX_PROVISION_SHA256: "4e0d35606c96812e82a2d4b95fa92acde1a12156735b18c5d695f13bff5c7832"
          GN_SANDBOX_PROOF_SHA256: "6dbfff335bf87d954be35e01072d046f2993897beb1a36ec6bebce4193a706a9"
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          node --input-type=module <<'SOURCE_BINDING'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
