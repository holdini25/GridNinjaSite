name: Qualification host policy diagnostic

# Diagnostic-only replacement. Original matrix workflow is preserved at 700228b.
# One approved push; no automatic rerun or restoration of the measurement job.
on:
  push:
    branches: [codex/qualification-compatibility]

permissions: {}

concurrency:
  group: qualification-compatibility-codex-qualification-compatibility
  cancel-in-progress: false

jobs:
  host-policy-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GN_PARENT: ${{ github.event.before }}
      GN_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Read bounded and filtered host-policy facts once
        shell: bash
        run: |
          /usr/bin/python3 -I - <<'PY'
          """One approved host-policy snapshot. No browser, policy write, or qualification."""
          import collections
          import hashlib
          import json
          import os
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone

          # Replaced by the builder with the exact reviewed argv, not workflow input.
          COMMANDS = [{'id': 'kernel', 'argv': ['uname', '-srvmo'], 'maxOutputBytes': 16384}, {'id': 'uid', 'argv': ['id', '-u'], 'maxOutputBytes': 16384}, {'id': 'gid', 'argv': ['id', '-g'], 'maxOutputBytes': 16384}, {'id': 'groups', 'argv': ['id', '-G'], 'maxOutputBytes': 16384}, {'id': 'image-and-run', 'argv': ['printenv', 'ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_ENVIRONMENT', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_EVENT_NAME'], 'maxOutputBytes': 16384}, {'id': 'os-release', 'argv': ['head', '-c', '8192', '--', '/etc/os-release'], 'maxOutputBytes': 8192}, {'id': 'apparmor-userns', 'argv': ['head', '-c', '4096', '--', '/proc/sys/kernel/apparmor_restrict_unprivileged_userns'], 'maxOutputBytes': 4096}, {'id': 'unprivileged-userns', 'argv': ['head', '-c', '4096', '--', '/proc/sys/kernel/unprivileged_userns_clone'], 'maxOutputBytes': 4096}, {'id': 'namespace-limit', 'argv': ['head', '-c', '4096', '--', '/proc/sys/user/max_user_namespaces'], 'maxOutputBytes': 4096}, {'id': 'apparmor-enabled', 'argv': ['head', '-c', '4096', '--', '/sys/module/apparmor/parameters/enabled'], 'maxOutputBytes': 4096}, {'id': 'active-lsm', 'argv': ['head', '-c', '8192', '--', '/sys/kernel/security/lsm'], 'maxOutputBytes': 8192}, {'id': 'self-profile', 'argv': ['head', '-c', '8192', '--', '/proc/self/attr/current'], 'maxOutputBytes': 8192}, {'id': 'self-apparmor-profile', 'argv': ['head', '-c', '8192', '--', '/proc/self/attr/apparmor/current'], 'maxOutputBytes': 8192}, {'id': 'loaded-profiles', 'argv': ['head', '-c', '262144', '--', '/sys/kernel/security/apparmor/profiles'], 'maxOutputBytes': 262144}, {'id': 'chrome-profile', 'argv': ['head', '-c', '65536', '--', '/etc/apparmor.d/chrome'], 'maxOutputBytes': 65536}, {'id': 'chrome-local-profile', 'argv': ['head', '-c', '65536', '--', '/etc/apparmor.d/local/chrome'], 'maxOutputBytes': 65536}, {'id': 'candidate-profile', 'argv': ['head', '-c', '65536', '--', '/etc/apparmor.d/gridninja-cft-155'], 'maxOutputBytes': 65536}, {'id': 'abi4', 'argv': ['head', '-c', '65536', '--', '/etc/apparmor.d/abi/4.0'], 'maxOutputBytes': 65536}, {'id': 'self-process-restrictions', 'argv': ['awk', '/^(Uid|Gid|Groups|Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp|Seccomp_filters):/', '/proc/self/status'], 'maxOutputBytes': 16384}, {'id': 'aa-enabled', 'argv': ['aa-status', '--enabled'], 'maxOutputBytes': 16384}, {'id': 'parser-version', 'argv': ['apparmor_parser', '--version'], 'maxOutputBytes': 16384}, {'id': 'protected-path-stat', 'argv': ['stat', '-c', '%n|%F|%u:%g|%a', '--', '/', '/var', '/var/lib', '/var/lib/gridninja-cft', '/var/lib/gridninja-cft/155.0.8059.79', '/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64', '/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome'], 'maxOutputBytes': 16384}, {'id': 'protected-path-resolution', 'argv': ['namei', '-l', '-x', '--', '/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome'], 'maxOutputBytes': 16384}, {'id': 'protected-path-acl', 'argv': ['getfacl', '-p', '--', '/', '/var', '/var/lib', '/var/lib/gridninja-cft', '/var/lib/gridninja-cft/155.0.8059.79', '/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64', '/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome'], 'maxOutputBytes': 16384}, {'id': 'mount-root', 'argv': ['findmnt', '--kernel', '--json', '--target', '/', '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS'], 'maxOutputBytes': 16384}, {'id': 'mount-var', 'argv': ['findmnt', '--kernel', '--json', '--target', '/var', '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS'], 'maxOutputBytes': 16384}, {'id': 'mount-varlib', 'argv': ['findmnt', '--kernel', '--json', '--target', '/var/lib', '--output', 'TARGET,SOURCE,FSTYPE,OPTIONS'], 'maxOutputBytes': 16384}, {'id': 'elevated-loaded-profiles', 'argv': ['sudo', '-n', '/usr/bin/head', '-c', '262144', '--', '/sys/kernel/security/apparmor/profiles'], 'maxOutputBytes': 262144}, {'id': 'elevated-active-lsm', 'argv': ['sudo', '-n', '/usr/bin/head', '-c', '8192', '--', '/sys/kernel/security/lsm'], 'maxOutputBytes': 8192}]
          ALLOWLIST_SHA256 = "4de3f5f1457164aedc326b302470efc3342d09eabf784ff1e4869f55b7a5edb5"
          PARENT = "700228b0e04932ea01b72eef45ea205cae513ca2"
          REF = "refs/heads/codex/qualification-compatibility"
          LIMIT = 1048576
          RESERVE = 4096
          PATHS = ["/", "/var", "/var/lib", "/var/lib/gridninja-cft",
                   "/var/lib/gridninja-cft/155.0.8059.79",
                   "/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64",
                   "/var/lib/gridninja-cft/155.0.8059.79/chrome-linux64/chrome"]
          META_RULES = {
              "ImageOS": r"ubuntu[0-9]{2,4}", "ImageVersion": r"[0-9]{8}\.[0-9]{1,8}\.[0-9]{1,8}",
              "RUNNER_OS": r"Linux", "RUNNER_ARCH": r"X64", "RUNNER_ENVIRONMENT": r"github-hosted",
              "GITHUB_RUN_ID": r"[0-9]{1,20}", "GITHUB_RUN_ATTEMPT": r"1",
              "GITHUB_SHA": r"[a-f0-9]{40}", "GITHUB_REF": re.escape(REF), "GITHUB_EVENT_NAME": r"push",
          }
          PROFILE_NAMES = {"chrome", "gridninja-cft-155", "/opt/google/chrome/chrome", PATHS[-1]}
          PROFILE_MODES = {"enforce", "complain", "unconfined", "kill", "prompt"}
          LSM_NAMES = {"capability", "landlock", "lockdown", "yama", "integrity", "apparmor", "bpf", "selinux", "smack", "tomoyo"}
          SENSITIVE = re.compile(r"(?i)(?:gh[pousr]_[A-Za-z0-9]{10,}|github_pat_[A-Za-z0-9_]{10,}|AKIA[A-Z0-9]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|\bbearer\s+\S+|\b(?:bearer|authorization|password|secret|api[_-]?key)\s*[:=]\s*\S+|https?://[^\s\"]+[?@])")


          def stamp():
              return datetime.now(timezone.utc).isoformat()


          def number(value):
              return int(value) if re.fullmatch(r"[0-9]{1,20}", value) else None


          def facts(command_id, raw, return_code):
              """Positive allowlisting: unknown text is never emitted, including stderr."""
              if not raw and return_code != 0:
                  return {"unavailable": True}
              s = raw.decode("utf-8", "replace").strip()
              result = {}
              if command_id in {"uid", "gid", "apparmor-userns", "unprivileged-userns", "namespace-limit"}:
                  result = {"value": number(s)}
              elif command_id == "groups":
                  result = {"numericGroups": [number(v) for v in s.split()] if all(number(v) is not None for v in s.split()) and len(s.split()) <= 64 else None}
              elif command_id == "kernel":
                  parts = s.split()
                  result = {"system": "Linux" if parts and parts[0] == "Linux" else None,
                            "release": parts[1] if len(parts) > 1 and re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.+_-]{1,64})?", parts[1]) else None,
                            "architecture": "x86_64" if "x86_64" in parts else None}
              elif command_id == "image-and-run":
                  lines = s.splitlines()
                  if return_code == 0 and len(lines) == len(META_RULES):
                      result = {key: value if re.fullmatch(rule, value) else None for (key, rule), value in zip(META_RULES.items(), lines)}
                  else:
                      result = {"metadataIncomplete": True}
              elif command_id == "os-release":
                  pairs = dict(re.findall(r'^([A-Z_]+)=[\"\']?([^\"\'\n]*)[\"\']?$', s, re.M))
                  for key, rule in {"ID": r"ubuntu", "VERSION_ID": r"[0-9]{2}\.[0-9]{2}", "VERSION_CODENAME": r"[a-z]{1,24}"}.items():
                      v = pairs.get(key, "")
                      result[key] = v if re.fullmatch(rule, v) else None
              elif command_id == "apparmor-enabled":
                  result = {"moduleEnabled": {"Y": True, "N": False}.get(s)}
              elif command_id in {"active-lsm", "elevated-active-lsm"}:
                  parts = s.split(",") if s else []
                  result = {"knownModules": [x for x in parts if x in LSM_NAMES], "unknownModuleCount": sum(x not in LSM_NAMES for x in parts)}
              elif command_id in {"self-profile", "self-apparmor-profile"}:
                  result = {"diagnosticChildLabel": s if s == "unconfined" else "other-or-unavailable", "notChromeLabel": True}
              elif command_id in {"loaded-profiles", "elevated-loaded-profiles"}:
                  modes, targets = collections.Counter(), {}
                  unknown = 0
                  for line in s.splitlines():
                      m = re.fullmatch(r"(.+) \(([^()]*)\)", line)
                      if not m or m[2] not in PROFILE_MODES:
                          unknown += 1
                          continue
                      modes[m[2]] += 1
                      if m[1] in PROFILE_NAMES:
                          targets[m[1]] = m[2]
                  result = {"lineCount": len(s.splitlines()), "modeCounts": dict(modes), "recognizedProfiles": targets, "unparsedLines": unknown,
                            "otherNamesSuppressed": True, "namesDoNotProveAttachments": True}
              elif command_id in {"chrome-profile", "chrome-local-profile", "candidate-profile", "abi4"}:
                  code_lines = []
                  for line in s.splitlines():
                      directive = re.fullmatch(r"\s*#(include(?:\s+if\s+exists)?\s+<(?:tunables/global|local/chrome)>)\s*(?:#.*)?", line)
                      code_lines.append(directive[1] if directive else line.split("#", 1)[0])
                  code = "\n".join(code_lines)
                  attachment_paths = [p for p in ["/opt/google/chrome/chrome", PATHS[-1]] if re.search(r"(?<![\w/*])" + re.escape(p) + r"(?=[\s\"{]|$)", code)]
                  result = {"contentSha256": hashlib.sha256(raw).hexdigest(),
                            "literalUsernsDirectiveFound": bool(re.search(r"(?:^|[{}\n])\s*userns\s*,", code)),
                            "literalUnconfinedFlagFound": bool(re.search(r"flags\s*=\s*\(\s*unconfined\s*\)", code)),
                            "recognizedPathMentions": attachment_paths,
                            "knownGlobalIncludeFound": "include <tunables/global>" in code,
                            "knownLocalChromeIncludeFound": bool(re.search(r"include(?: if exists)? <local/chrome>", code)),
                            "rawPolicySuppressed": True, "notEffectivePermissionProof": True}
              elif command_id == "self-process-restrictions":
                  patterns = {"Uid": r"[0-9]+(?:\s+[0-9]+){3}", "Gid": r"[0-9]+(?:\s+[0-9]+){3}", "Groups": r"[0-9 ]*",
                              "CapInh": r"[a-f0-9]{1,32}", "CapPrm": r"[a-f0-9]{1,32}", "CapEff": r"[a-f0-9]{1,32}",
                              "CapBnd": r"[a-f0-9]{1,32}", "CapAmb": r"[a-f0-9]{1,32}", "NoNewPrivs": r"[01]", "Seccomp": r"[012]", "Seccomp_filters": r"[0-9]{1,8}"}
                  for line in s.splitlines():
                      key, sep, value = line.partition(":")
                      value = " ".join(value.split())
                      if sep and key in patterns and re.fullmatch(patterns[key], value):
                          result[key] = value
              elif command_id == "aa-enabled":
                  result = {"statusExitCode": return_code, "disabledMustNotBeInferredFromReadFailure": True}
              elif command_id == "parser-version":
                  match = re.search(r"AppArmor parser version\s+([0-9]+(?:\.[0-9]+){1,3}(?:-[0-9A-Za-z.+~]+)?)", s, re.I)
                  result = {"version": match[1] if match else None}
              elif command_id == "protected-path-stat":
                  rows = []
                  for line in s.splitlines():
                      parts = line.split("|")
                      if len(parts) == 4 and parts[0] in PATHS and parts[1] in {"directory", "regular file", "regular empty file", "symbolic link"} and re.fullmatch(r"[0-9]{1,10}:[0-9]{1,10}", parts[2]) and re.fullmatch(r"[0-7]{1,4}", parts[3]):
                          rows.append({"path": parts[0], "type": parts[1], "uidGid": parts[2], "mode": parts[3]})
                  result = {"components": rows, "suppressedOrUnparsedLineCount": len(s.splitlines()) - len(rows)}
              elif command_id == "protected-path-resolution":
                  result = {"symlinkRowsObserved": sum(bool(re.match(r"\s*l[rwxstST-]{9}\s", line)) for line in s.splitlines()),
                            "lineCount": len(s.splitlines()), "rawTargetsSuppressed": True, "resolutionNotIndependentlyProven": True}
              elif command_id == "protected-path-acl":
                  entries, current = [], None
                  for line in s.splitlines():
                      if line.startswith("# file: "):
                          path = line[len("# file: "):]
                          current = {"path": path, "entries": []} if path in PATHS else None
                          if current is not None:
                              entries.append(current)
                      elif current is not None:
                          m = re.fullmatch(r"(default:)?(user|group|mask|other):([^:]*):([rwx-]{3})(?:\s+#effective:([rwx-]{3}))?", line)
                          if m:
                              qualifier = m[3]
                              kind = "owner-or-unnamed" if not qualifier else "root" if qualifier == "root" else "runner" if qualifier == "runner" else "named-redacted"
                              current["entries"].append({"default": bool(m[1]), "kind": m[2], "qualifier": kind, "permissions": m[4], "effective": m[5]})
                  result = {"components": entries, "namesAndCommentsSuppressed": True}
              elif command_id in {"mount-root", "mount-var", "mount-varlib"}:
                  try:
                      parsed = json.loads(s)
                      rows = []
                      known_flags = {"ro", "rw", "nosuid", "suid", "nodev", "dev", "noexec", "exec", "relatime", "noatime", "strictatime", "lazytime", "seclabel"}
                      for fs in parsed.get("filesystems", []):
                          target = fs.get("target")
                          if target not in {"/", "/var", "/var/lib"}:
                              continue
                          options = fs.get("options", "").split(",")
                          rows.append({"target": target, "fstype": fs.get("fstype") if fs.get("fstype") in {"ext4", "xfs", "btrfs", "overlay", "tmpfs", "zfs"} else None,
                                       "knownFlags": [v for v in options if v in known_flags], "otherOptionsSuppressed": sum(v not in known_flags for v in options), "sourceSuppressed": True})
                      result = {"mounts": rows}
                  except (ValueError, TypeError, AttributeError):
                      result = {"parseUnavailable": True}
              else:
                  result = {"unsupportedCommandId": True}
              # Additional defense for shaped string fields; never release matching text.
              if SENSITIVE.search(json.dumps(result, ensure_ascii=True)):
                  return {"factsSuppressedBySensitivePattern": True}
              return result


          def classify_error(raw, return_code):
              text = raw.decode("utf-8", "replace").lower()
              if "permission denied" in text or "operation not permitted" in text:
                  return "permission-denied"
              if "no such file" in text or "not found" in text:
                  return "missing-or-unavailable"
              if "a password is required" in text or "not allowed" in text:
                  return "privileged-read-unavailable"
              return "nonzero-or-stderr" if return_code != 0 or raw else None


          def run_read(spec, child_env):
              start = stamp()
              max_out = spec["maxOutputBytes"]
              buffers = {"stdout": bytearray(), "stderr": bytearray()}
              seen = {"stdout": 0, "stderr": 0}
              caps = {"stdout": max_out, "stderr": 4096}
              selector = selectors.DefaultSelector()
              proc = None
              timed_out = False
              cleanup = "not-needed"
              closed = False
              try:
                  proc = subprocess.Popen(spec["argv"], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                          shell=False, cwd="/", env=child_env, start_new_session=True)
                  for name, stream in [("stdout", proc.stdout), ("stderr", proc.stderr)]:
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ, name)
                  deadline = time.monotonic() + 5
                  phase = "read"
                  while True:
                      if not selector.get_map() and proc.poll() is not None:
                          closed = True
                          break
                      now = time.monotonic()
                      if now >= deadline:
                          if phase == "kill":
                              break
                          timed_out = True
                          sig = signal.SIGTERM if phase == "read" else signal.SIGKILL
                          cleanup = "term" if phase == "read" else "kill"
                          try:
                              os.killpg(proc.pid, sig)
                          except ProcessLookupError:
                              pass
                          phase = "term" if phase == "read" else "kill"
                          deadline = now + 1
                      for key, _ in selector.select(min(0.05, max(0, deadline - time.monotonic()))):
                          try:
                              chunk = os.read(key.fileobj.fileno(), 8192)
                          except BlockingIOError:
                              continue
                          if not chunk:
                              selector.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          name = key.data
                          seen[name] += len(chunk)
                          room = max(0, caps[name] + 1 - len(buffers[name]))
                          buffers[name].extend(chunk[:room])
                  code = proc.poll()
                  out = bytes(buffers["stdout"][:max_out])
                  err = bytes(buffers["stderr"][:4096])
                  head_limit = spec["argv"][spec["argv"].index("-c") + 1] if "head" in os.path.basename(spec["argv"][0]) and "-c" in spec["argv"] else None
                  if spec["argv"][0] == "sudo" and "-c" in spec["argv"]:
                      head_limit = spec["argv"][spec["argv"].index("-c") + 1]
                  uncertain = seen["stdout"] > max_out or (head_limit is not None and seen["stdout"] >= int(head_limit))
                  return {"kind": "read", "id": spec["id"], "startedAt": start, "finishedAt": stamp(), "exitCode": code,
                          "timeout": timed_out, "closed": closed, "cleanup": cleanup,
                          "closureScope": "direct-child-exit-and-pipes-eof",
                          "stdoutCaptureLimitBytes": max_out, "stderrCaptureLimitBytes": 4096,
                          "stdoutBytesObserved": seen["stdout"], "stderrPresent": bool(seen["stderr"]),
                          "stdoutPotentiallyIncomplete": uncertain, "stderrTruncated": seen["stderr"] > 4096,
                          "errorCategory": classify_error(err, code), "facts": facts(spec["id"], out, code),
                          "completeRead": code == 0 and not timed_out and closed and not uncertain}
              except FileNotFoundError:
                  return {"kind": "read", "id": spec["id"], "startedAt": start, "finishedAt": stamp(), "completeRead": False, "closed": True, "errorCategory": "missing-tool"}
              except Exception:
                  # No raw exception text is permitted in the public log.
                  if proc is not None and proc.poll() is None:
                      try:
                          os.killpg(proc.pid, signal.SIGKILL)
                          proc.wait(timeout=1)
                      except (OSError, subprocess.TimeoutExpired):
                          pass
                  return {"kind": "read", "id": spec["id"], "startedAt": start, "finishedAt": stamp(), "completeRead": False, "closed": False, "errorCategory": "collector-error"}
              finally:
                  for key in list(selector.get_map().values()):
                      key.fileobj.close()
                  selector.close()


          class Writer:
              def __init__(self, stream=None):
                  self.stream = stream if stream is not None else sys.stdout.buffer
                  self.count = 0

              def emit(self, record, final=False):
                  # Also neutralize the legacy Actions command marker anywhere in a line.
                  payload = (json.dumps(record, ensure_ascii=True, separators=(",", ":")).replace("#", "\\u0023") + "\n").encode("utf-8")
                  if SENSITIVE.search(payload.decode("ascii")):
                      payload = b'{"kind":"record-suppressed","reason":"sensitive-pattern"}\n'
                  bound = LIMIT if final else LIMIT - RESERVE
                  if self.count + len(payload) > bound:
                      return False
                  self.stream.write(payload)
                  self.stream.flush()
                  self.count += len(payload)
                  return True


          def main():
              writer = Writer()
              metadata = {key: os.environ.get(key, "") for key in META_RULES}
              valid = all(re.fullmatch(META_RULES[key], value) for key, value in metadata.items())
              valid = valid and os.environ.get("GN_PARENT") == PARENT and os.environ.get("GN_WORKFLOW_SHA") == metadata["GITHUB_SHA"]
              valid = valid and os.environ.get("GITHUB_REPOSITORY") == "holdini25/GridNinjaSite" and sys.platform == "linux"
              if not valid:
                  writer.emit({"kind": "guard-failure", "diagnosticOnly": True, "qualification": False, "detailsSuppressed": True}, final=True)
                  return 1
              writer.emit({"kind": "start", "diagnosticOnly": True, "qualification": False, "allowlistSha256": ALLOWLIST_SHA256, "metadata": metadata, "recordedAt": stamp()})
              child_env = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LANG": "C", "LC_ALL": "C", **metadata}
              prior, results = {}, []
              stopped = None
              for spec in COMMANDS:
                  counterpart = {"elevated-loaded-profiles": "loaded-profiles", "elevated-active-lsm": "active-lsm"}.get(spec["id"])
                  ordinary = prior.get(counterpart, {})
                  access_denied = (ordinary.get("closed") is True and not ordinary.get("timeout")
                                   and ordinary.get("exitCode") not in {None, 0}
                                   and ordinary.get("errorCategory") == "permission-denied")
                  if counterpart and not access_denied:
                      reason = "ordinary-read-complete" if ordinary.get("completeRead") else "ordinary-read-not-access-denied"
                      record = {"kind": "skipped", "id": spec["id"], "reason": reason}
                  else:
                      record = run_read(spec, child_env)
                      prior[spec["id"]] = record
                  if not writer.emit(record):
                      stopped = "public-output-limit"
                      break
                  results.append(record)
                  if record.get("closed") is False:
                      stopped = "unconfirmed-command-closure"
                      break
              writer.emit({"kind": "finish", "diagnosticOnly": True, "qualification": False, "recordedAt": stamp(),
                           "commandRecords": len(results), "completeReads": sum(x.get("completeRead", False) for x in results),
                           "skipped": sum(x["kind"] == "skipped" for x in results), "stopped": stopped,
                           "publicBytesBeforeFinish": writer.count, "missingFactsRemainUnknown": True}, final=True)
              return 1 if stopped else 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception:
                  # Fixed text only, never a traceback containing host data.
                  sys.stdout.write('{"kind":"fatal","diagnosticOnly":true,"qualification":false,"detailsSuppressed":true}\n')
                  sys.exit(1)
          PY
