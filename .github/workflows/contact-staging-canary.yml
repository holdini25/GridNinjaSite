name: Contact staging canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-canary:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22.23.2", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:staging:contact
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_CANARY_AUTHORIZED_ORIGIN: ${{ secrets.STAGING_CANARY_AUTHORIZED_ORIGIN }}
          STAGING_CANARY_AUTHORIZED: staging-only
          STAGING_CANARY_EMAIL: ${{ secrets.STAGING_CANARY_EMAIL }}
          STAGING_CANARY_OPERATOR_REFERENCE: ${{ vars.STAGING_CANARY_OPERATOR_REFERENCE }}
          STAGING_CANARY_DELIVERY_EMAIL: ${{ secrets.STAGING_CANARY_DELIVERY_EMAIL }}
          STAGING_CANARY_EXPECTED_ATTESTATION_SHA256: ${{ vars.STAGING_CANARY_EXPECTED_ATTESTATION_SHA256 }}
          STAGING_CANARY_PREFLIGHT_TOKEN: ${{ secrets.STAGING_CANARY_PREFLIGHT_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: contact-staging-${{ github.sha }}
          path: test-results/staging
          if-no-files-found: error
          retention-days: 14
